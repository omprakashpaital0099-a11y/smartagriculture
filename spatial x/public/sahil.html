<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f1">
  <title>Fieldwise | Smart Agriculture Monitoring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    /* 01. Theme tokens and foundations */
    :root {
      color-scheme: light;
      --page: #f4f7f1; --surface: #ffffff; --surface-2: #edf3e9; --ink: #1e3025;
      --muted: #68776d; --line: #dce5d9; --green: #276b45; --green-2: #4d9562;
      --green-wash: #e4f1e5; --lime: #c9e46b; --orange: #d88339; --red: #bd3434;
      --red-wash: #fff0ed; --shadow: 0 14px 38px rgba(34, 63, 42, .07); --radius: 12px;
    }
    [data-theme="dark"] {
      color-scheme: dark; --page: #111b16; --surface: #1a2820; --surface-2: #24352a;
      --ink: #edf5ec; --muted: #a8b9aa; --line: #34493a; --green: #82c494;
      --green-2: #a0d6a8; --green-wash: #263d2d; --lime: #d0e888; --orange: #f0a45f;
      --red: #ff7770; --red-wash: #482b2a; --shadow: 0 14px 38px rgba(0, 0, 0, .2);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 84px; }
    body { margin: 0; background: var(--page); color: var(--ink); font-family: "DM Sans", sans-serif; line-height: 1.55; transition: background .25s, color .25s; }
    button, select { font: inherit; }
    button, a, select { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, select:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; }
    a { color: inherit; }
    .wrap { width: min(1180px, calc(100% - 44px)); margin-inline: auto; }
    .section { padding: 82px 0; }
    .eyebrow { color: var(--green); font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { font-family: Manrope, "DM Sans", sans-serif; }
    h2 { margin-bottom: 12px; font-size: clamp(1.8rem, 3.5vw, 2.65rem); line-height: 1.12; letter-spacing: 0; }
    .section-intro { max-width: 660px; margin-bottom: 32px; color: var(--muted); }
    .icon { width: 21px; height: 21px; display: inline-block; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* 02. Navigation and controls */
    .topbar { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--page) 93%, transparent); backdrop-filter: blur(14px); }
    .nav { min-height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-family: Manrope, sans-serif; font-weight: 800; font-size: 1.15rem; }
    .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 10px 10px 10px 3px; color: #183a25; background: var(--lime); }
    .nav-links { display: flex; align-items: center; gap: 24px; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: .87rem; font-weight: 600; }
    .nav-links a:hover { color: var(--green); }
    .nav-tools { display: flex; align-items: center; gap: 9px; }
    .icon-button, .select-control { min-width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: var(--surface); }
    .icon-button { display: grid; place-items: center; cursor: pointer; }
    .select-control { padding: 0 9px; font-size: .82rem; }
    .mobile-menu { display: none; }

    /* 03. Hero */
    .hero { position: relative; overflow: hidden; padding: 83px 0 78px; background: var(--surface-2); }
    .hero::before { position: absolute; inset: 0 0 0 53%; content: ""; opacity: .5; background-image: linear-gradient(135deg, transparent 48%, color-mix(in srgb, var(--green-2) 16%, transparent) 49%, transparent 50%), linear-gradient(45deg, transparent 48%, color-mix(in srgb, var(--green-2) 12%, transparent) 49%, transparent 50%); background-size: 38px 38px; mask-image: linear-gradient(90deg, transparent, #000); }
    .hero-grid { position: relative; display: grid; grid-template-columns: 1.15fr .85fr; align-items: center; gap: 48px; }
    .hero .eyebrow { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 18px; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--green-2) 18%, transparent); }
    .hero h1 { max-width: 700px; margin-bottom: 18px; font-size: clamp(2.4rem, 5.5vw, 4.7rem); letter-spacing: 0; line-height: 1.04; }
    .hero h1 span { color: var(--green); }
    .hero-copy { max-width: 590px; margin-bottom: 26px; color: var(--muted); font-size: 1.08rem; }
    .button { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 0 18px; border: 1px solid transparent; border-radius: 8px; text-decoration: none; font-weight: 700; cursor: pointer; transition: transform .18s, background .18s; }
    .button:hover { transform: translateY(-2px); }
    .button-primary { color: white; background: #276b45; }
    [data-theme="dark"] .button-primary { color: #112219; background: #a8d7ad; }
    .button-secondary { color: var(--ink); border-color: var(--line); background: var(--surface); }
    .hero-visual { position: relative; min-height: 310px; display: grid; place-items: center; }
    .field-art { position: relative; width: min(390px, 100%); aspect-ratio: 1.25; overflow: hidden; border: 1px solid color-mix(in srgb, var(--green) 18%, transparent); border-radius: 48% 48% 14px 14px; background: linear-gradient(180deg, #dceccf 0%, #b9d79c 49%, #71975c 50%, #365a3d 100%); box-shadow: var(--shadow); }
    [data-theme="dark"] .field-art { background: linear-gradient(180deg, #344933 0%, #526f49 49%, #6b8f54 50%, #243c2b 100%); }
    .sun { position: absolute; top: 13%; right: 18%; width: 53px; height: 53px; border-radius: 50%; background: #f5d77b; box-shadow: 0 0 42px rgba(245, 215, 123, .65); }
    .field-row { position: absolute; left: -8%; width: 120%; height: 36%; border-top: 2px solid rgba(246, 245, 205, .55); border-radius: 50%; transform: rotate(-10deg); }
    .field-row:nth-of-type(2) { top: 56%; }.field-row:nth-of-type(3) { top: 70%; }.field-row:nth-of-type(4) { top: 84%; }
    .crop { position: absolute; bottom: 27%; left: 23%; width: 34px; height: 85px; border-left: 3px solid #284b2f; }
    .crop::before, .crop::after { position: absolute; width: 26px; height: 12px; content: ""; border-radius: 100% 0 100% 0; background: #487c42; }
    .crop::before { top: 22px; left: -25px; transform: rotate(15deg); }.crop::after { top: 39px; left: 1px; transform: rotate(-18deg) scaleX(-1); }
    .crop.two { left: 58%; bottom: 34%; transform: scale(.78); }.crop.three { left: 78%; bottom: 28%; transform: scale(.9); }
    .visual-tag { position: absolute; left: 0; bottom: 18px; padding: 11px 15px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); font-size: .8rem; font-weight: 700; }

    /* 04. About and architecture */
    .about-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 54px; align-items: start; }
    .about-copy { color: var(--muted); }
    .objective-list { display: grid; gap: 12px; margin-top: 22px; }
    .objective { display: flex; align-items: flex-start; gap: 12px; }
    .check { flex: 0 0 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; color: var(--green); background: var(--green-wash); font-weight: 800; }
    .objective span:last-child { color: var(--ink); }
    .how-box { padding: 22px; border-left: 3px solid var(--green-2); border-radius: 0 var(--radius) var(--radius) 0; background: var(--surface-2); }
    .how-box h3 { margin: 0 0 8px; font-size: 1rem; }.how-box p { margin: 0; color: var(--muted); }
    .architecture { padding-top: 14px; }
    .architecture-flow { display: grid; grid-template-columns: 1fr 46px 1fr 46px 1fr; align-items: center; gap: 13px; margin-top: 28px; }
    .arch-node { min-height: 116px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; padding: 15px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); text-align: center; }
    .arch-node .icon { width: 30px; height: 30px; color: var(--green); }.arch-node strong { font-size: .95rem; }.arch-node small { color: var(--muted); }
    .flow-arrow { color: var(--green-2); text-align: center; font-size: 1.55rem; }

    /* 05. Live dashboard */
    .dashboard-section { background: var(--surface-2); }
    .section-heading { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 24px; }
    .section-heading .section-intro { margin: 0; }
    .live-status { display: inline-flex; align-items: center; gap: 9px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); white-space: nowrap; font-size: .8rem; font-weight: 700; }
    .sensor-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .sensor-card { min-width: 0; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); animation: rise .5s both; }
    .sensor-card:nth-child(2) { animation-delay: .06s; }.sensor-card:nth-child(3) { animation-delay: .12s; }.sensor-card:nth-child(4) { animation-delay: .18s; }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .sensor-title { display: flex; align-items: center; gap: 10px; font-size: .95rem; font-weight: 700; }
    .sensor-icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; color: var(--green); background: var(--green-wash); }
    .sensor-icon .icon { width: 20px; height: 20px; }
    .value { margin: 18px 0 4px; font-family: Manrope, sans-serif; font-size: clamp(1.7rem, 3vw, 2.3rem); font-weight: 800; line-height: 1; }
    .value small { color: var(--muted); font-family: "DM Sans", sans-serif; font-size: .95rem; font-weight: 600; }
    .sub-value { color: var(--muted); font-size: .83rem; }
    .chart-wrap { height: 110px; margin-top: 16px; }
    .chart-wrap canvas { width: 100% !important; height: 100% !important; }
    .chart-label { color: var(--muted); font-size: .72rem; }
    .tank-row { display: grid; grid-template-columns: 1fr 76px; gap: 16px; align-items: center; }
    .tank { position: relative; width: 58px; height: 112px; margin-inline: auto; overflow: hidden; border: 3px solid var(--green); border-top-width: 5px; border-radius: 8px 8px 12px 12px; background: var(--surface-2); }
    .tank-fill { position: absolute; right: 0; bottom: 0; left: 0; height: 60%; background: linear-gradient(180deg, #7fc69a, #367d59); transition: height .6s; }
    .tank-fill::after { position: absolute; top: -5px; left: -10%; width: 120%; height: 10px; content: ""; border-radius: 50%; background: rgba(255,255,255,.42); }
    .status-pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 99px; color: var(--green); background: var(--green-wash); font-size: .75rem; font-weight: 800; }
    .status-pill.danger { color: var(--red); background: var(--red-wash); }
    .fire-card.is-fire { border-color: var(--red); animation: fireFlash 1s infinite; }
    .fire-card.is-fire .sensor-icon { color: var(--red); background: var(--red-wash); }.fire-card.is-fire .value { color: var(--red); }
    .chart-unavailable { display: grid; height: 100%; place-items: center; color: var(--muted); font-size: .8rem; }

    /* 06. Protection, alerts and relay */
    .protection-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; }
    .alert-panel, .relay-panel, .history-panel { padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .alert-banner { min-height: 54px; display: flex; align-items: center; gap: 11px; margin: 16px 0; padding: 12px 14px; border-radius: 8px; color: var(--green); background: var(--green-wash); font-weight: 700; }
    .alert-banner.is-fire { color: var(--red); background: var(--red-wash); animation: fireFlash 1s infinite; }
    .alert-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .alert-item { display: flex; align-items: flex-start; gap: 10px; color: var(--muted); font-size: .9rem; }.alert-item strong { color: var(--ink); }
    .alert-marker { flex: 0 0 8px; width: 8px; height: 8px; margin-top: 7px; border-radius: 50%; background: var(--orange); }.alert-marker.ok { background: var(--green-2); }
    .relay-panel { display: flex; flex-direction: column; justify-content: space-between; }
    .relay-status { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 16px 0; }
    .relay-word { font-family: Manrope, sans-serif; font-size: 1.45rem; font-weight: 800; }
    .switch { position: relative; width: 64px; height: 36px; flex: 0 0 64px; }.switch input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .switch-track { position: absolute; inset: 0; border-radius: 999px; background: #839087; cursor: pointer; transition: background .2s; }
    .switch-track::after { position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; content: ""; border-radius: 50%; background: white; transition: transform .2s; }
    .switch input:checked + .switch-track { background: #34794e; }.switch input:checked + .switch-track::after { transform: translateX(28px); }
    .switch input:focus-visible + .switch-track { outline: 3px solid var(--lime); outline-offset: 3px; }.relay-note { margin: 0; color: var(--muted); font-size: .85rem; }
    .history-panel { grid-column: 1 / -1; }.history-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 0; margin: 15px 0 0; list-style: none; }
    .history-item { min-height: 78px; padding: 12px; border-left: 3px solid var(--green-2); background: var(--surface-2); font-size: .82rem; }.history-time { display: block; margin-top: 6px; color: var(--muted); font-size: .73rem; }
    .fire-button { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--line)); background: var(--surface); }

    /* 07. Hardware and footer */
    .components-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 28px; }
    .component { min-height: 120px; padding: 18px; border-top: 2px solid var(--green-2); background: var(--surface); }
    .component .icon { width: 25px; height: 25px; margin-bottom: 12px; color: var(--green); }
    .component strong { display: block; margin-bottom: 4px; font-size: .9rem; }.component small { color: var(--muted); }
    footer { padding: 42px 0 24px; color: #eaf3e9; background: #203c2b; }
    .footer-grid { display: grid; grid-template-columns: 1fr; gap: 40px; padding-bottom: 30px; }
    footer p, footer a { color: #c4d6c6; }.footer-links { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: start; }.footer-links a { text-decoration: none; }
    .footer-bottom { display: flex; justify-content: space-between; gap: 16px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.2); color: #c4d6c6; font-size: .8rem; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; clip-path: inset(50%); }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fireFlash { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--red) 22%, transparent); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    @media (max-width: 850px) {
      .nav-links { display: none; position: absolute; top: 69px; right: 0; left: 0; padding: 16px 22px 20px; border-bottom: 1px solid var(--line); background: var(--page); }
      .nav-links.open { display: grid; grid-template-columns: repeat(2, 1fr); }.mobile-menu { display: grid; }
      .hero-grid { gap: 20px; }.hero { padding: 64px 0; }.about-grid { grid-template-columns: 1fr; gap: 26px; }.components-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .wrap { width: min(100% - 30px, 1180px); }.section { padding: 62px 0; }.hero-grid { grid-template-columns: 1fr; }.hero { padding: 55px 0 44px; }.hero-visual { min-height: 260px; }.field-art { width: min(340px, 93%); }
      .nav { min-height: 64px; }.nav-links { top: 63px; }.nav-tools { gap: 6px; }.icon-button { min-width: 40px; height: 40px; }.select-control { max-width: 94px; padding-inline: 5px; }
      .section-heading { align-items: flex-start; flex-direction: column; }.sensor-grid, .protection-grid { grid-template-columns: 1fr; }.history-panel { grid-column: auto; }.history-list { grid-template-columns: 1fr; }
      .architecture-flow { grid-template-columns: 1fr; gap: 7px; }.arch-node { min-height: 92px; }.flow-arrow { transform: rotate(90deg); }.components-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }.component { padding: 14px; }
      .footer-grid { grid-template-columns: 1fr; gap: 20px; }.footer-bottom { flex-direction: column; }
    }
  </style>
</head>
<body>

  <header class="topbar"><div class="wrap nav">
    <a class="brand" href="#home" aria-label="Fieldwise home"><span class="brand-mark"><svg class="icon"><use href="#i-leaf"/></svg></span>Fieldwise</a>
    <nav class="nav-links" id="navLinks" aria-label="Main navigation"><a href="#about" data-i18n="navAbout"></a><a href="#dashboard" data-i18n="navDashboard"></a><a href="#protection" data-i18n="navProtection"></a><a href="#components" data-i18n="navComponents"></a></nav>
    <div class="nav-tools"><label class="sr-only" for="languageSelect" data-i18n="languageLabel"></label><select class="select-control" id="languageSelect" aria-label="Language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="or">ଓଡ଼ିଆ</option><option value="te">తెలుగు</option></select><button class="icon-button" id="themeButton" type="button" aria-label="Toggle color theme" title="Toggle color theme"><svg class="icon"><use href="#i-moon"/></svg></button><button class="icon-button mobile-menu" id="menuButton" type="button" aria-label="Open navigation" aria-expanded="false"><svg class="icon"><use href="#i-menu"/></svg></button></div>
  </div></header>
  <main>
    <!-- 09. Hero -->

    /* 17. Local state and accessible language/theme handling */
    const state = { soil: 42, temperature: 27.4, humidity: 64, water: 78, fire: false, simulatedFire: false, relay: false, apiOnline: false, history: [], previousAlerts: new Set(), language: "en" };
    const chartInstances = {};
    let themePreference = localStorage.getItem("fieldwise-theme") || "system";
    const languageSelect = document.getElementById("languageSelect");
    const t = (key) => translations[state.language][key] || translations.en[key] || key;
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const randomWalk = (value, amount, bounds) => clamp(value + (Math.random() - .5) * amount, bounds[0], bounds[1]);

    function applyLanguage(language) {
      state.language = translations[language] ? language : "en";
      document.documentElement.lang = state.language;
      languageSelect.value = state.language;
      document.querySelectorAll("[data-i18n]").forEach((element) => { element.textContent = t(element.dataset.i18n); });
      document.getElementById("themeButton").title = t("themeToggle");
      document.getElementById("themeButton").setAttribute("aria-label", t("themeToggle"));
      document.getElementById("menuButton").setAttribute("aria-label", t("openNavigation"));
      document.getElementById("relaySwitch").setAttribute("aria-label", t("togglePump"));
      document.getElementById("soilChart").setAttribute("aria-label", t("soilTitle"));
      document.getElementById("climateChart").setAttribute("aria-label", t("climateTitle"));

    }
    function applyTheme(theme) {
      const resolved = theme === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : theme;
      document.documentElement.dataset.theme = resolved;
      document.querySelector('meta[name="theme-color"]').content = resolved === "dark" ? "#111b16" : "#f4f7f1";
      const muted = getComputedStyle(document.documentElement).getPropertyValue("--muted").trim();
      const line = getComputedStyle(document.documentElement).getPropertyValue("--line").trim();
      Object.values(chartInstances).forEach((chart) => { if (!chart) return; chart.options.scales.x.ticks.color = muted; chart.options.scales.y.ticks.color = muted; chart.options.scales.x.grid.color = line; chart.options.scales.y.grid.color = line; chart.update("none"); });
    }
    function pushHistory(key) { state.history.unshift({ key, time: new Date() }); state.history = state.history.slice(0, CONFIG.historyLimit); }

    /* 18. Charts and simulated readings */
    function makeChart(id, datasets, min, max) {
      const canvas = document.getElementById(id);
      if (!window.Chart) { canvas.parentElement.innerHTML = `<div class="chart-unavailable">${t("chartUnavailable")}</div>`; return null; }
      const ink = getComputedStyle(document.documentElement).getPropertyValue("--muted").trim();
      const line = getComputedStyle(document.documentElement).getPropertyValue("--line").trim();
      const labels = Array.from({ length: CONFIG.chartPoints }, (_, index) => String(index + 1));
      return new Chart(canvas, { type: "line", data: { labels, datasets: datasets.map((item) => ({ label: t(item.label), translationKey: item.label, data: Array.from({ length: CONFIG.chartPoints }, () => item.initial), borderColor: item.color, backgroundColor: item.color + "22", fill: true, tension: .38, pointRadius: 0, pointHoverRadius: 4, borderWidth: 2 })) }, options: { responsive: true, maintainAspectRatio: false, animation: { duration: 350 }, interaction: { intersect: false, mode: "index" }, plugins: { legend: { display: datasets.length > 1, labels: { color: ink, usePointStyle: true, boxWidth: 7, font: { family: "DM Sans", size: 10 } } }, tooltip: { displayColors: true } }, scales: { x: { display: false, grid: { color: line }, ticks: { color: ink } }, y: { min, max, grid: { color: line }, ticks: { color: ink, maxTicksLimit: 4, font: { size: 10 } } } } } });
    }
    function initCharts() {
      chartInstances.soil = makeChart("soilChart", [{ label: "moisture", initial: state.soil, color: "#4e9b68" }], 0, 100);
      chartInstances.climate = makeChart("climateChart", [{ label: "temperature", initial: state.temperature, color: "#dc8744" }, { label: "humidity", initial: state.humidity, color: "#4b8cb3" }], 0, 100);
      chartInstances.water = makeChart("waterChart", [{ label: "level", initial: state.water, color: "#4689ad" }], 0, 100);
      chartInstances.fire = makeChart("fireChart", [{ label: "fireTitle", initial: 0, color: "#bd3434" }], 0, 1);
    }
    function updateChart(chart, values) { if (!chart) return; chart.data.datasets.forEach((dataset, index) => { dataset.data.push(values[index]); dataset.data.shift(); }); chart.update("none"); }
    function updateChartsLanguage() { Object.values(chartInstances).forEach((chart) => { if (!chart) return; chart.data.datasets.forEach((dataset) => { dataset.label = t(dataset.translationKey); }); chart.update("none"); }); }
    function simulateReadings() {
      state.soil = Math.round(randomWalk(state.soil, 8, CONFIG.soilRange));
      state.temperature = Math.round(randomWalk(state.temperature, 1.6, CONFIG.temperatureRange) * 10) / 10;
      state.humidity = Math.round(randomWalk(state.humidity, 5, CONFIG.humidityRange));
      state.water = Math.round(randomWalk(state.water, 3.5, CONFIG.waterRange));
      state.fire = state.simulatedFire;
      updateChart(chartInstances.soil, [state.soil]); updateChart(chartInstances.climate, [state.temperature, state.humidity]);
      updateChart(chartInstances.water, [state.water]); updateChart(chartInstances.fire, [state.fire ? 1 : 0]);
      updateAlerts(); render();
    }

    // Prefer backend data; retain the original randomized dashboard if the API is unavailable.
    function loadChartHistory(readings) {
      if (!Array.isArray(readings) || readings.length === 0) return;
      const samples = readings.slice(-CONFIG.chartPoints);
      const labels = samples.map((reading, index) => {
        if (!reading.timestamp) return String(index + 1);
        return new Date(reading.timestamp).toLocaleTimeString(state.language, { hour: "2-digit", minute: "2-digit" });
      });
      for (const chart of Object.values(chartInstances)) {
        if (!chart) continue;
        chart.data.labels = labels;
        for (const dataset of chart.data.datasets) {
          const field = dataset.translationKey === "moisture" ? "soil" : dataset.translationKey === "temperature" ? "temperature" : dataset.translationKey === "humidity" ? "humidity" : dataset.translationKey === "level" ? "waterLevel" : "fire";
          dataset.data = samples.map((reading) => field === "fire" ? (reading.fire ? 1 : 0) : reading[field]);
        }
        chart.update("none");
      }
    }
    async function syncDashboard() {
      if (THINGSPEAK_READINGS.length) {
        const reading = THINGSPEAK_READINGS[THINGSPEAK_READINGS.length - 1];
        state.soil = reading.soil;
        state.temperature = reading.temperature;
        state.humidity = reading.humidity;
        state.water = reading.waterLevel;
        state.fire = reading.fire || state.simulatedFire;
        state.relay = false;
        state.apiOnline = true;
        loadChartHistory(THINGSPEAK_READINGS);
        updateAlerts();
        render();
        return;
      }
      try {
        const [sensorResponse, historyResponse, pumpResponse] = await Promise.all([
          fetch(API_URL, { cache: "no-store" }),
          fetch(HISTORY_URL, { cache: "no-store" }),
          fetch("/api/pump", { cache: "no-store" })
        ]);
        if (!sensorResponse.ok || !historyResponse.ok || !pumpResponse.ok) throw new Error("Fieldwise API is unavailable.");
        const [reading, history, pump] = await Promise.all([sensorResponse.json(), historyResponse.json(), pumpResponse.json()]);
        if (![reading.soil, reading.temperature, reading.humidity, reading.waterLevel].every(Number.isFinite) || typeof reading.fire !== "boolean") throw new Error("The API returned an invalid sensor reading.");
        state.soil = reading.soil;
        state.temperature = reading.temperature;
        state.humidity = reading.humidity;
        state.water = reading.waterLevel;
        state.fire = reading.fire || state.simulatedFire;
        state.relay = pump.state === "ON";
        state.apiOnline = true;
        loadChartHistory(history.readings);
        updateAlerts();
        render();
      } catch (_) {
        state.apiOnline = false;
        simulateReadings();
      }
    }

    function updateAlerts() {
      const active = new Set();
      if (state.fire) active.add("fire");
      if (state.water < CONFIG.lowWaterThreshold) active.add("water");
      if (state.soil < CONFIG.soilMoistureThreshold) active.add("soil");
      for (const key of active) if (!state.previousAlerts.has(key)) pushHistory(key === "fire" ? "historyFire" : key === "water" ? "historyWater" : "historySoil");
      for (const key of state.previousAlerts) if (!active.has(key) && key !== "fire") pushHistory("historyRecovered");
      state.previousAlerts = active;
    }
    function render() {
      document.getElementById("soilValue").textContent = state.soil;
      document.getElementById("tempValue").textContent = state.temperature.toFixed(1);
      document.getElementById("humidityValue").textContent = state.humidity;
      document.getElementById("waterValue").textContent = state.water;
      document.getElementById("tankFill").style.height = `${state.water}%`;
      document.getElementById("tankFill").parentElement.setAttribute("aria-label", `${t("waterTitle")}: ${state.water}%`);
      document.getElementById("soilState").textContent = state.soil < CONFIG.soilMoistureThreshold ? t("soilLow") : t("soilNormal");
      document.getElementById("fireCard").classList.toggle("is-fire", state.fire);
      document.getElementById("fireValue").textContent = state.fire ? t("fireDetected") : t("safe");
      document.getElementById("fireState").textContent = state.fire ? t("fireAlarm") : t("safe");
      document.getElementById("alertBanner").classList.toggle("is-fire", state.fire);
      document.getElementById("alertMessage").textContent = state.fire ? t("fireAlarm") : t("systemNormal");
      const alerts = [];
      if (state.fire) alerts.push("fireDetected");
      if (state.water < CONFIG.lowWaterThreshold) alerts.push("lowWater");
      if (state.soil < CONFIG.soilMoistureThreshold) alerts.push("irrigationRequired");
      document.getElementById("alertList").innerHTML = alerts.length ? alerts.map((key) => `<li class="alert-item"><span class="alert-marker"></span><strong>${t(key)}</strong></li>`).join("") : `<li class="alert-item"><span class="alert-marker ok"></span>${t("systemNormal")}</li>`;
      document.getElementById("relaySwitch").checked = state.relay;
      document.getElementById("relayWord").textContent = state.relay ? t("relayOn") : t("relayOff");
      document.getElementById("fireButton").querySelector("span").textContent = state.simulatedFire ? t("clearFire") : t("simulateFire");
      const history = state.history.length ? state.history : [{ key: "historyEmpty", time: null }];
      document.getElementById("historyList").innerHTML = history.map((entry) => `<li class="history-item">${t(entry.key)}${entry.time ? `<time class="history-time" datetime="${entry.time.toISOString()}">${entry.time.toLocaleTimeString(state.language, { hour: "2-digit", minute: "2-digit", second: "2-digit" })}</time>` : ""}</li>`).join("");
    }

    /* 20. Interaction wiring and startup */
    languageSelect.addEventListener("change", (event) => applyLanguage(event.target.value));
    document.getElementById("themeButton").addEventListener("click", () => { themePreference = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; localStorage.setItem("fieldwise-theme", themePreference); applyTheme(themePreference); });
    matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (themePreference === "system") applyTheme("system"); });
    document.getElementById("fireButton").addEventListener("click", () => {
      state.simulatedFire = !state.simulatedFire;
      if (state.simulatedFire) {
        try { const context = new AudioContext(); const oscillator = context.createOscillator(); const gain = context.createGain(); oscillator.frequency.value = 760; gain.gain.value = .035; oscillator.connect(gain); gain.connect(context.destination); oscillator.start(); oscillator.stop(context.currentTime + .25); oscillator.onended = () => context.close(); } catch (_) { /* Visual alarm remains available when audio is blocked. */ }
      } else pushHistory("historyFireCleared");
      state.fire = state.simulatedFire; updateAlerts(); updateChart(chartInstances.fire, [state.fire ? 1 : 0]); render();
    });
    document.getElementById("relaySwitch").addEventListener("change", async (event) => {
      state.relay = event.target.checked;
      pushHistory(state.relay ? "historyManualOn" : "historyManualOff");
      render();
      try {
        const response = await fetch("/api/pump", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ state: state.relay ? "ON" : "OFF" }) });
        if (!response.ok) throw new Error("Pump API request failed.");
        state.relay = (await response.json()).state === "ON";
        render();
      } catch (_) {
        state.apiOnline = false;
      }
    });
    document.getElementById("menuButton").addEventListener("click", (event) => { const open = document.getElementById("navLinks").classList.toggle("open"); event.currentTarget.setAttribute("aria-expanded", String(open)); });
    document.querySelectorAll(".nav-links a").forEach((link) => link.addEventListener("click", () => { document.getElementById("navLinks").classList.remove("open"); document.getElementById("menuButton").setAttribute("aria-expanded", "false"); }));
    applyTheme(themePreference); initCharts(); applyLanguage("en"); updateAlerts(); render();
    syncDashboard();
    window.setInterval(syncDashboard, CONFIG.refreshIntervalMs);
  </script>
</body>
</html>
